name: orbitron_tactics
description: "OrbitronTactics - Strategic board game for two players"
publish_to: 'none'
version: 0.6.0-alpha.1+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.1
  uuid: ^4.5.1
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    # Battle ship sprites, one folder per fleet (see FleetSkin)
    - assets/fleets/vanguard/
    - assets/fleets/solar_crusade/
    - assets/fleets/void_hive/
    - assets/fleets/neon_runners/
    - assets/fleets/iron_armada/
    - assets/fleets/crystal_choir/
    - assets/fleets/ronin_blades/
    - assets/fleets/atomic_age/
    - assets/fleets/abyssal_tide/
    - assets/fleets/star_nomads/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#E5D6B4"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
